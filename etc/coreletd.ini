# coreletd daemon configuration — ClockworkPi uConsole + HackerGadgets AIO v2
#
# Install to /etc/coreletd/coreletd.ini, or pass --config elsewhere.
# Values shown are the built-in defaults unless noted.
#
# What a MeshCore radio lets its companion app change is not set here: the
# frequency, bandwidth, spreading factor and coding rate, the TX power and
# duty cycle, the node's name and position, and repeat. An app sets them, as
# it would on a MeshCore radio, and the daemon keeps them in the state
# directory (see [storage] below).
#
# There is deliberately no default frequency: which band you may transmit on
# is a legal question, not a technical one. Until an app names one the radio
# stays idle and nothing is transmitted. Fit the antenna before it does.

[radio]

# Every node on your mesh must match the sync word; a mismatch is silence, not
# an error.
lora_sync_word = 0x12

# Preamble length in symbols. Unset means what MeshCore uses: 32 symbols at
# SF8 and below, 16 above. Set it only for a mesh that has agreed on something
# else — both ends decode a mismatch, but the shorter side gives away sync
# margin.
# lora_preamble = 32

[hardware]

# AIO v2 hardware wiring
# The SX1262 hangs off SPI1 with chip select on SPI1-CE0 (GPIO18), driven by
# the kernel, so lora_nss_pin stays unset.
#
# Enable the bus first — add to /boot/firmware/config.txt and reboot:
#     dtparam=spi=on
#     dtoverlay=spi1-1cs
#
spidev = /dev/spidev1.0
lora_gpiochip = gpiochip0

lora_irq_pin = 26     # DIO1
lora_busy_pin = 24
lora_reset_pin = 25
# lora_nss_pin =      # unset: the SPI controller drives CE0
# lora_rxen_pin =     # unused on AIO v2, DIO2 drives the RF switch
# lora_txen_pin =

# The AIO v2 gates power to each subsystem behind a GPIO and the daemon does
# not touch those switches — the LoRa rail (GPIO16) is yours to turn on, with
# whatever manages the board's power. The others are GPS=27, SDR=7, USB=23.
#
# While the rail is off the SX1262 never answers and every SPI read comes back
# as zeroes, so the daemon treats an absent radio as a normal state: it starts
# without one, checks every N seconds, and picks the radio up when it appears.
# The same check notices the rail going off mid-run and reconnects afterwards.
# 0 turns this off, and a radio that does not answer at startup is fatal again.
lora_retry_interval = 10

# DIO2 switches the antenna between TX and RX; DIO3 powers the TCXO at 1.8 V.
dio2_as_rf_switch = 1
lora_tcxo = 1.8
rx_boosted_gain = 1
current_limit = 140
spi_speed = 2000000

[node]

# Re-advertise every N seconds so the mesh keeps fresh routes to you.
# 0 disables automatic adverts (the app can still trigger one). 7200 = 2 hours.
advert_interval = 7200

# With repeat on — an app's to turn on — a flood packet that has already
# taken this many hops is not repeated.
max_hops = 32

[companion]

# A local Unix socket is the default because the companion protocol has no
# authentication whatsoever. The systemd unit creates /run/coreletd, the
# socket is owned by the daemon's user/group, and its mode is always 0660.
companion_interface = unix
companion_socket = /run/coreletd/companion.sock

# To serve TCP instead, set companion_interface = tcp. It defaults to loopback;
# widening companion_bind exposes the unauthenticated protocol to anyone who
# can connect. Prefer SSH or WireGuard for access from another machine.
companion_bind = 127.0.0.1
companion_port = 5000

[storage]

# Required, with no default: the directory that holds this node. It must be an
# absolute path to a directory that already exists -- systemd creates this one
# for the packaged service -- and the daemon keeps everything in it under fixed
# names:
#
#   identity   the node's private key; this file *is* the node
#   contacts   the nodes it has heard, and the routes learned to them
#   channels   channel names and their secrets
#   messages   messages received while no app was connected, kept until one
#              collects them: an ack has told the sender to stop retrying, so
#              nobody is left to ask for them again
#   settings   what a companion app set: the radio preset, the node's name
#              and position, and repeat — only the keys it changed, the rest
#              left at their defaults
#
# Every file is written 0600, and a directory open to other users is warned
# about at startup. A copy of the directory is a complete backup; README.md in
# /usr/share/doc/coreletd says how to take one and put it back.
state_dir = /var/lib/coreletd

[logging]

# error | warn | info | debug | trace
log_level = info
