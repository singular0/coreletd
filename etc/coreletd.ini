# coreletd daemon configuration — ClockworkPi uConsole + HackerGadgets AIO v2
#
# Install to /etc/coreletd/coreletd.ini, or pass --config elsewhere.
# Values shown are the built-in defaults unless noted.

[radio]

# REQUIRED
# There is deliberately no default frequency: which band you may transmit on is
# a legal question, not a technical one. Set the plan for your region and make
# sure your antenna is fitted before starting the daemon.
#
#   EU868 : lora_freq = 869.618
#   US915 : lora_freq = 910.525
#
# lora_freq = 869.618

# MeshCore's standard on-air settings. Every node on your mesh must match the
# first three; a mismatch is silence, not an error.
lora_bw = 62.5
lora_sf = 8
# Coding rate denominator: 5 is 4/5, MeshCore's own default, and 8 is 4/8. The
# explicit LoRa header carries it, so this is not an interop setting — but a
# packet at 4/8 costs about 35% more airtime than the mesh around it, on every
# repeater that forwards it as well as here.
lora_cr = 5
lora_tx_power = 22
lora_sync_word = 0x12

# Preamble length in symbols. Unset means what MeshCore uses: 32 symbols at
# SF8 and below, 16 above. Set it only for a mesh that has agreed on something
# else — both ends decode a mismatch, but the shorter side gives away sync
# margin.
# lora_preamble = 32

# Regulatory transmit budget as a percentage of wall time, measured over a
# rolling hour. EU868 is 1% in most sub-bands; 869.4-869.65 MHz allows 10%.
duty_cycle = 10.0

[hardware]

# AIO v2 hardware wiring
# The SX1262 hangs off SPI1 with chip select on SPI1-CE0 (GPIO18), driven by
# the kernel, so lora_nss_pin stays unset.
#
# Enable the bus first — add to /boot/firmware/config.txt and reboot:
#     dtparam=spi=on
#     dtoverlay=spi1-1cs
#
spidev = /dev/spidev1.0
lora_gpiochip = gpiochip0

lora_irq_pin = 26     # DIO1
lora_busy_pin = 24
lora_reset_pin = 25
# lora_nss_pin =      # unset: the SPI controller drives CE0
# lora_rxen_pin =     # unused on AIO v2, DIO2 drives the RF switch
# lora_txen_pin =

# The AIO v2 gates power to each subsystem behind a GPIO and the daemon does
# not touch those switches — the LoRa rail (GPIO16) is yours to turn on, with
# whatever manages the board's power. The others are GPS=27, SDR=7, USB=23.
#
# While the rail is off the SX1262 never answers and every SPI read comes back
# as zeroes, so the daemon treats an absent radio as a normal state: it starts
# without one, checks every N seconds, and picks the radio up when it appears.
# The same check notices the rail going off mid-run and reconnects afterwards.
# 0 turns this off, and a radio that does not answer at startup is fatal again.
lora_retry_interval = 10

# DIO2 switches the antenna between TX and RX; DIO3 powers the TCXO at 1.8 V.
dio2_as_rf_switch = 1
lora_tcxo = 1.8
rx_boosted_gain = 1
current_limit = 140
spi_speed = 2000000

[node]

# The name other nodes see. The signing key itself is generated on first run
# and stored in the state directory — back that file up, it *is* your node.
#
# At most 31 bytes, or 23 once lat/lon below are set: the advert carries 32
# bytes of application data, MeshCore verifies the signature over exactly that
# much, and a longer name makes the signature fail on every node that hears it.
# The daemon refuses to start rather than truncate, because the alternative is
# a node that transmits normally and is dropped everywhere without saying so.
advert_name = uConsole

# Re-advertise every N seconds so the mesh keeps fresh routes to you.
# 0 disables automatic adverts (the app can still trigger one). 7200 = 2 hours.
advert_interval = 7200

# Published position, in decimal degrees. Leave both at 0 to omit location.
lat = 0.0
lon = 0.0

# Relay other nodes' flood traffic. Off by default: a companion radio that also
# repeats will chew through your duty-cycle budget and your battery.
repeat = 0
max_hops = 32

[companion]

# A local Unix socket is the default because the companion protocol has no
# authentication whatsoever. The systemd unit creates /run/coreletd, the
# socket is owned by the daemon's user/group, and its mode is always 0660.
companion_interface = unix
companion_socket = /run/coreletd/companion.sock

# To serve TCP instead, set companion_interface = tcp. It defaults to loopback;
# widening companion_bind exposes the unauthenticated protocol to anyone who
# can connect. Prefer SSH or WireGuard for access from another machine.
companion_bind = 127.0.0.1
companion_port = 5000

[storage]

# Defaults to /var/lib/coreletd when run as root (systemd StateDirectory),
# otherwise ~/.local/share/coreletd.
# state_dir = /var/lib/coreletd
# identity_path = /var/lib/coreletd/identity
# contacts_path = /var/lib/coreletd/contacts
# channels_path = /var/lib/coreletd/channels

# Messages received while no companion app was connected. They are held here
# until an app collects them, and kept across restarts: an ack tells the sender
# to stop retrying, so anything only in memory would be lost with nobody left
# to ask for it again. The file holds message text and is written 0600.
# messages_path = /var/lib/coreletd/messages

[logging]

# error | warn | info | debug | trace
log_level = info
