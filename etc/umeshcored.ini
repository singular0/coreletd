# umeshcore daemon configuration — ClockworkPi uConsole + HackerGadgets AIO v2
#
# Install to /etc/umeshcore/umeshcored.ini, or pass --config elsewhere.
# Values shown are the built-in defaults unless noted.

# ---------------------------------------------------------------------------
# Radio — REQUIRED
# ---------------------------------------------------------------------------
# There is deliberately no default frequency: which band you may transmit on is
# a legal question, not a technical one. Set the plan for your region and make
# sure your antenna is fitted before starting the daemon.
#
#   EU868 : lora_freq = 869.618
#   US915 : lora_freq = 910.525
#
lora_freq = 869.618

# MeshCore's standard on-air settings. Every node on your mesh must match.
lora_bw = 62.5
lora_sf = 8
lora_cr = 8
lora_tx_power = 22
lora_preamble = 16
lora_sync_word = 0x12

# Regulatory transmit budget as a percentage of wall time, measured over a
# rolling hour. EU868 is 1% in most sub-bands; 869.4-869.65 MHz allows 10%.
duty_cycle = 10.0

# ---------------------------------------------------------------------------
# AIO v2 hardware wiring
# ---------------------------------------------------------------------------
# The SX1262 hangs off SPI1 with chip select on SPI1-CE0 (GPIO18), driven by
# the kernel, so lora_nss_pin stays unset.
#
# Enable the bus first — add to /boot/firmware/config.txt and reboot:
#     dtparam=spi=on
#     dtoverlay=spi1-1cs
#
spidev = /dev/spidev1.0
lora_gpiochip = gpiochip0

lora_irq_pin = 26     # DIO1
lora_busy_pin = 24
lora_reset_pin = 25
# lora_nss_pin =      # unset: the SPI controller drives CE0
# lora_rxen_pin =     # unused on AIO v2, DIO2 drives the RF switch
# lora_txen_pin =

# The AIO v2 gates power to each subsystem. The LoRa rail must be high or the
# SX1262 never answers and every SPI read comes back as zeroes.
# (For reference, the others are GPS=27, SDR=7, internal USB=23.)
lora_power_enable_pin = 16

# DIO2 switches the antenna between TX and RX; DIO3 powers the TCXO at 1.8 V.
dio2_as_rf_switch = 1
lora_tcxo = 1.8
rx_boosted_gain = 1
current_limit = 140
spi_speed = 2000000

# ---------------------------------------------------------------------------
# Node identity
# ---------------------------------------------------------------------------
# The name other nodes see. The signing key itself is generated on first run
# and stored in the state directory — back that file up, it *is* your node.
advert_name = uConsole

# Re-advertise every N seconds so the mesh keeps fresh routes to you.
# 0 disables automatic adverts (the app can still trigger one). 7200 = 2 hours.
advert_interval = 7200

# Published position, in decimal degrees. Leave both at 0 to omit location.
lat = 0.0
lon = 0.0

# Relay other nodes' flood traffic. Off by default: a companion radio that also
# repeats will chew through your duty-cycle budget and your battery.
repeat = 0
max_hops = 32

# ---------------------------------------------------------------------------
# Companion protocol (TCP)
# ---------------------------------------------------------------------------
# Where the MeshCore app, meshcore-cli and meshtui connect. Loopback only by
# default — the companion protocol has no authentication whatsoever, so anyone
# who can reach this port can read your messages and send as you.
# Only widen this to 0.0.0.0 on a network you control.
companion_bind = 127.0.0.1
companion_port = 5000

# ---------------------------------------------------------------------------
# Storage and logging
# ---------------------------------------------------------------------------
# Defaults to /var/lib/umeshcore when run as root (systemd StateDirectory),
# otherwise ~/.local/share/umeshcore.
# state_dir = /var/lib/umeshcore
# identity_path = /var/lib/umeshcore/identity
# contacts_path = /var/lib/umeshcore/contacts
# channels_path = /var/lib/umeshcore/channels

# error | warn | info | debug | trace
log_level = info

# ---------------------------------------------------------------------------
# Development without hardware
# ---------------------------------------------------------------------------
# Runs the whole daemon with a fake radio: transmissions are logged and
# discarded, and packets can be replayed from a file of hex lines.
# mock_radio = 1
# mock_replay_file = /path/to/packets.hex
